<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">iPhone Duo specifications and cheaper alternatives</title>
<desc id="desc">Lowest Item Review Lab infographic showing iPhone Duo key specifications and lower-price alternatives including iPhone 18 Pro, Pixel 10 Pro Fold and Galaxy Z Fold8.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061022"/><stop offset="1" stop-color="#132a57"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#73d9ff"/><stop offset=".5" stop-color="#8675ff"/><stop offset="1" stop-color="#ff83c8"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#52e3ff"/><stop offset="1" stop-color="#a774ff"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".38"/></filter>
</defs>
<rect width="1600" height="900" rx="38" fill="url(#bg)"/>
<circle cx="140" cy="85" r="190" fill="#4ca8ff" opacity=".10"/><circle cx="1510" cy="120" r="260" fill="#a774ff" opacity=".10"/>
<text x="90" y="105" fill="#bff8d9" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="3">NEW FOLDABLE • SMART BUY GUIDE</text>
<text x="90" y="180" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="800">iPhone Duo</text>
<text x="90" y="226" fill="#b8c9e4" font-family="Arial,Helvetica,sans-serif" font-size="28">Key specs • upgrade value • lower-cost alternatives</text>

<!-- stylized foldable -->
<g transform="translate(90 290)" filter="url(#shadow)">
  <rect x="0" y="0" width="280" height="480" rx="36" fill="#151922" stroke="#7f8da7" stroke-width="6"/>
  <rect x="18" y="18" width="244" height="444" rx="28" fill="url(#screen)"/>
  <rect x="115" y="30" width="50" height="13" rx="7" fill="#10131b"/>
  <g transform="translate(315 0)">
    <rect x="0" y="0" width="520" height="480" rx="34" fill="#161b24" stroke="#7f8da7" stroke-width="6"/>
    <rect x="18" y="18" width="484" height="444" rx="26" fill="url(#screen)"/>
    <line x1="260" y1="18" x2="260" y2="462" stroke="#ffffff" stroke-opacity=".17" stroke-width="3"/>
  </g>
  <text x="30" y="430" fill="#fff" font-family="Arial" font-size="22" font-weight="700">5.4″ outer</text>
  <text x="485" y="430" fill="#fff" font-family="Arial" font-size="22" font-weight="700">7.6″ inner</text>
</g>

<!-- spec cards -->
<g font-family="Arial,Helvetica,sans-serif">
  <g transform="translate(990 285)"><rect width="520" height="105" rx="22" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/><text x="26" y="40" fill="#fff" font-size="28" font-weight="700">A20 Pro + iOS 27</text><text x="26" y="76" fill="#b8c9e4" font-size="22">Foldable multitasking • Apple Pencil support</text></g>
  <g transform="translate(990 410)"><rect width="520" height="105" rx="22" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/><text x="26" y="40" fill="#fff" font-size="28" font-weight="700">48 MP Dual Fusion cameras</text><text x="26" y="76" fill="#b8c9e4" font-size="22">0.5× • 1× • up to 2× optical-quality zoom</text></g>
  <g transform="translate(990 535)"><rect width="520" height="105" rx="22" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".12"/><text x="26" y="40" fill="#fff" font-size="28" font-weight="700">From $1,999 • 256 GB</text><text x="26" y="76" fill="#b8c9e4" font-size="22">Pre-order Oct 16 • Available Oct 23, 2026</text></g>
</g>

<rect x="90" y="805" width="1420" height="2" fill="url(#accent)" opacity=".7"/>
<text x="90" y="850" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Cheaper paths:</text>
<text x="270" y="850" fill="#b8c9e4" font-family="Arial,Helvetica,sans-serif" font-size="24">iPhone 18 Pro $1,199 • Pixel 10 Pro Fold $1,799 • Galaxy Z Fold8 $1,899.99</text>
<text x="1195" y="850" fill="#8bd4ff" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">lowestitem.com</text>
</svg>
