<g transform="rotate(-10 314 485)"><rect x="153" y="458" width="325" height="84" rx="12" fill="none" stroke="#ff5d69" stroke-width="8"/><text x="181" y="517" fill="#ff5d69" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="900">DISCONTINUED</text></g>

