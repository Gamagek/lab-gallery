<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">iPhone 17 Pro and iPhone 17 Pro Max discontinued after iPhone 18 Pro launch</title>
<desc id="desc">Lowest Item Review Lab news graphic showing the transition from iPhone 17 Pro models to the new iPhone 18 Pro lineup.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04111f"/><stop offset=".55" stop-color="#0a2442"/><stop offset="1" stop-color="#07101e"/></linearGradient>
  <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6dde8"/><stop offset=".45" stop-color="#6f7b8d"/><stop offset="1" stop-color="#1c2634"/></linearGradient>
  <linearGradient id="newphone" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2c999"/><stop offset=".45" stop-color="#87654b"/><stop offset="1" stop-color="#251b17"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<circle cx="950" cy="90" r="260" fill="#38bdf8" opacity=".07"/><circle cx="180" cy="590" r="310" fill="#8b5cf6" opacity=".08"/>
<text x="58" y="68" fill="#7dd3fc" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" letter-spacing="4">APPLE LINEUP UPDATE • SEPTEMBER 2026</text>
<text x="58" y="130" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="51" font-weight="800">iPhone 17 Pro &amp; 17 Pro Max</text>
<text x="58" y="188" fill="#d9efff" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="900">Discontinued</text>
<text x="61" y="227" fill="#a9bed1" font-family="Arial,Helvetica,sans-serif" font-size="23">after the iPhone 18 Pro lineup was announced</text>

