name: Sync Spreadsheet Data & Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download JSON Feed from Apps Script
        run: |
          curl -L "${{ secrets.APPS_SCRIPT_URL }}?action=json" -o data.new.json

      - name: Replace data.json
        run: |
          if [ -s data.new.json ]; then
            mv data.new.json data.json
          else
            echo "Downloaded JSON is empty"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push Changes
        run: |
          git add data.json
          git diff --staged --quiet || git commit -m "chore: update gallery data from spreadsheet [skip ci]"
          git push
