name: Update Media Data & Generate Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: lab-gallery-media-generator
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download JSON Feed with Safe Fallback
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          set -euo pipefail
          rm -f data.new.json

          if curl -L --fail --connect-timeout 15 --max-time 90 \
            "$GAS_URL?action=json" -o data.new.json \
            && jq empty data.new.json >/dev/null 2>&1; then
              mv data.new.json data.json
              echo "Downloaded and validated fresh data.json"
          else
              echo "WARNING: Google Apps Script did not return valid JSON."
              echo "Keeping the last known-good data.json so the site can still build."
              rm -f data.new.json
              jq empty data.json
          fi

      - name: Keep Curated Catalogue Pages
        run: node scripts/ensure-static-catalogue.js

      - name: Generate SEO Pages and Core XML Sitemaps
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: node scripts/generate-pages.js

      - name: Generate Dedicated Image and Video SEO Sitemaps
        run: node scripts/generate-media-sitemaps.js

      - name: Apply Rich Custom Review Pages and Sanitize Schema
        run: node scripts/apply-custom-pages.js

      - name: Generate Crawl-First HTML Directory
        run: node scripts/generate-crawl-directory.js

      - name: Verify Crawl Essentials
        run: |
          set -e
          test -s index.html
          test -s all-reviews.html
          test -s sitemap.xml
          test -s sitemap-index.xml
          grep -q 'https://reviews.lowestitem.com/all-reviews.html' sitemap.xml
          grep -q 'Sitemap: https://reviews.lowestitem.com/sitemap-index.xml' robots.txt
          echo "Crawl essentials verified"

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          git add data.json index.html all-reviews.html pages/ samsung-galaxy-s26-fe-review/ samsung-galaxy-s26-vs-iphone-16/ sitemap.xml review-sitemap.xml media-sitemap.xml image-sitemap.xml video-sitemap.xml sitemap-index.xml robots.txt
          git diff --cached --quiet || git commit -m "Auto update review pages and SEO discovery files"
          git push origin main
