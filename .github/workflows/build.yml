name: Sync Spreadsheet Data & Build

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  sync-media-feed:
    name: Fetch and Update Data Feed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Live Feed from Google Apps Script
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          if [ -z "$GAS_URL" ]; then
            echo "::error::GAS_URL repository secret is missing or empty."
            exit 1
          fi
          echo "Fetching latest SEO media JSON feed from Apps Script Web App..."
          curl -sL -m 30 "$GAS_URL" -o temp_feed.json
          if [ ! -s temp_feed.json ]; then
            echo "::error::Received empty response from Apps Script URL."
            exit 1
          fi

      - name: Validate and Format JSON
        run: |
          echo "Validating JSON payload structure with jq..."
          if ! jq . temp_feed.json > data.json; then
            echo "::error::Invalid JSON returned from Google Apps Script."
            cat temp_feed.json
            exit 1
          fi
          rm -f temp_feed.json
          echo "Successfully formatted data.json"

      - name: Commit and Push Changes to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main || git checkout -b main
          git add data.json
          git diff --staged --quiet || (git commit -m "chore: sync automated SEO media feed [skip ci]" && git pull origin main --rebase --autostash || true && git push origin main --force)
