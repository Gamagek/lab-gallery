name: Update Media Data & Generate Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download JSON Feed
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          curl -L "$GAS_URL?action=json" -o data.json
          jq empty data.json

      - name: Generate Static SEO Pages with Comparison & Comment Hub
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: |
          node -e '
            const fs = require("fs");
            const items = JSON.parse(fs.readFileSync("data.json", "utf8"));
            const gasUrl = process.env.GAS_URL;

            if (!fs.existsSync("pages")) {
              fs.mkdirSync("pages");
            }

            items.forEach(item => {
              if (!item.id) return;

              let commentsHtml = "";
              if (item.comments && Array.isArray(item.comments)) {
                item.comments.forEach(c => {
                  commentsHtml += "<div style=\"background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:10px; margin-bottom:8px; font-size:13px;\">" +
                    "<strong>" + (c.author || "Anonymous") + "</strong> <span style=\"font-size:16px;\">" + (c.emoji || "") + "</span>" +
                    "<p style=\"margin:5px 0;\">" + (c.text || "") + "</p>" +
                    (c.imageUrl ? "<img src=\"" + c.imageUrl + "\" style=\"max-width:100%; max-height:120px; border-radius:4px; margin-top:5px; display:block;\">" : "") +
                    "<div style=\"text-align:right; margin-top:5px;\">" +
                    "<button onclick=\"deleteComment(\x27" + c.commentId + "\x27, \x27" + gasUrl + "\x27)\" style=\"background:#ef4444; color:#fff; border:none; padding:2px 6px; font-size:10px; border-radius:3px; cursor:pointer;\">Delete (Admin)</button>" +
                    "</div>" +
                    "</div>";
                });
              }

              let html = "<!DOCTYPE html>\n" +
              "<html lang=\"en\">\n" +
              "<head>\n" +
              "    <meta charset=\"UTF-8\">\n" +
              "    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n" +
              "    <title>" + (item.seoTitle || item.rawTitle || "AI Media Review") + "</title>\n" +
              "    <meta name=\"description\" content=\"" + (item.description || "") + "\">\n" +
              "    <meta name=\"keywords\" content=\"" + (item.keywords || "") + "\">\n" +
              "    <link rel=\"stylesheet\" href=\"../style.css\">\n" +
              "</head>\n" +
              "<body>\n" +
              "    <header>\n" +
              "        <h1>" + (item.seoTitle || item.rawTitle || "") + "</h1>\n" +
              "        <p>Verified specifications & permanent VIP upgrade intelligence</p>\n" +
              "    </header>\n" +
              "    <main style=\"max-width:800px; margin:20px auto; padding:20px;\">\n" +
              "        <article style=\"background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,.08); padding:20px;\">\n" +
              "            \n" +
              "            <div class=\"admin-panel\" style=\"background:#f8fafc; padding:20px; border-radius:10px; border:1px solid #e2e8f0; margin-bottom:20px;\">\n" +
              "                <h3 style=\"margin-bottom:10px; font-size:18px;\">⚡ VIP Upgrade Intelligence Hub</h3>\n" +
              "                <p style=\"font-size:13px; color:#64748b; margin-bottom:15px;\">Compare specs, true upgrade paths, real costs, and performance percentages using real-time web grounding.</p>\n" +
              "                <input type=\"text\" id=\"compare-query-" + item.id + "\" placeholder=\"e.g., Samsung S25 vs iPhone 16\" style=\"width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:6px; margin-bottom:10px; font-size:14px; background:#fff;\">\n" +
              "                <button onclick=\"runComparison(\x27" + item.id + "\x27, \x27" + gasUrl + "\x27)\" style=\"width:100%;\">Compare & Analyze Upgrades</button>\n" +
              "                <div id=\"comparison-result-" + item.id + "\" style=\"margin-top:15px; font-size:14px; color:#334155; line-height: 1.6;\"></div>\n" +
              "            </div>\n" +

              "            <div id=\"public-seo-content\" style=\"margin-bottom:20px;\">\n" +
              "                <div id=\"top-banner-container\">" + (item.customImage ? "<img src=\"" + item.customImage + "\" alt=\"Banner\" style=\"width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-bottom:15px;\">" : "") + "</div>\n" +
              "                <div id=\"rendered-seo-body\">" + (item.customContent ? item.customContent : "<p style=\"color:#64748b;\">No custom comparison published yet. Use the comparison tool above or edit below.</p>") + "</div>\n" +
              "            </div>\n" +

              "            <div style=\"background:#f1f5f9; padding:15px; border-radius:8px; margin-bottom:20px; border:1px solid #cbd5e1;\">\n" +
              "                <details>\n" +
              "                    <summary style=\"font-weight:bold; font-size:14px; cursor:pointer; color:#1e293b;\">🛠️ Edit Content & Header Image</summary>\n" +
              "                    <div style=\"margin-top:10px;\">\n" +
              "                        <label style=\"font-size:12px; font-weight:bold; display:block; margin-bottom:4px;\">Top Header Image URL (Not bigger than media file):</label>\n" +
              "                        <input type=\"text\" id=\"edit-img-" + item.id + "\" value=\"" + (item.customImage || "") + "\" placeholder=\"https://...\" style=\"width:100%; padding:8px; margin-bottom:8px; border:1px solid #cbd5e1; border-radius:4px;\">\n" +
              "                        <label style=\"font-size:12px; font-weight:bold; display:block; margin-bottom:4px;\">Editable HTML / Markdown Content:</label>\n" +
              "                        <textarea id=\"edit-content-" + item.id + "\" rows=\"6\" style=\"width:100%; padding:8px; border:1px solid #cbd5e1; border-radius:4px; font-family:monospace; font-size:12px;\">" + (item.customContent || "") + "</textarea>\n" +
              "                        <button onclick=\"applyEdits(\x27" + item.id + "\x27)\" style=\"background:#16a34a; color:#fff; border:none; padding:8px 14px; border-radius:4px; margin-top:6px; cursor:pointer; font-weight:bold;\">💾 Save & Apply Locally</button>\n" +
              "                        <p style=\"font-size:11px; color:#64748b; margin-top:4px;\">Copy the updated HTML/Markdown into your Google Sheet cell (CustomContent & CustomImage columns) to update permanently across builds.</p>\n" +
              "                    </div>\n" +
              "                </details>\n" +
              "            </div>\n" +

              "            <figure style=\"margin:20px 0 20px 0;\">\n" +
              (item.type === "video" ? "                <video controls style=\"width:100%; aspect-ratio:16/9; object-fit:cover;\"><source src=\"" + item.url + "\"></video>\n" : "                <img src=\"" + item.url + "\" alt=\"" + (item.alt || item.rawTitle) + "\" style=\"width:100%; aspect-ratio:16/9; object-fit:cover;\">\n") +
              "            </figure>\n" +
              "            <p style=\"color:#555;\">" + (item.description || "") + "</p>\n" +

              "            <div style=\"margin-top:30px; border-top:1px solid #e2e8f0; padding-top:20px;\">\n" +
              "                <h4 style=\"margin-bottom:15px; font-size:16px;\">💬 Community Comments & Reactions</h4>\n" +
              "                <div id=\"comments-list-" + item.id + "\">" + (commentsHtml || "<p style=\"font-size:13px; color:#64748b;\">No comments yet. Be the first to share your thoughts!</p>") + "</div>\n" +
              "                \n" +
              "                <div style=\"background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0; margin-top:15px;\">\n" +
              "                    <h5 style=\"font-size:13px; margin-bottom:8px;\">Leave a Comment</h5>\n" +
              "                    <input type=\"text\" id=\"comment-author-" + item.id + "\" placeholder=\"Your Name\" style=\"width:100%; padding:8px; margin-bottom:8px; border:1px solid #cbd5e1; border-radius:4px; font-size:13px;\">\n" +
              "                    <div style=\"display:flex; gap:8px; margin-bottom:8px;\">\n" +
              "                        <select id=\"comment-emoji-" + item.id + "\" style=\"padding:8px; border:1px solid #cbd5e1; border-radius:4px;\">\n" +
              "                            <option value=\"👍\">👍 Thumbs Up</option>\n" +
              "                            <option value=\"❤️\">❤️ Heart</option>\n" +
              "                            <option value=\"🔥\">🔥 Fire</option>\n" +
              "                            <option value=\"💡\">💡 Insightful</option>\n" +
              "                            <option value=\"⭐\">⭐ Star</option>\n" +
              "                        </select>\n" +
              "                        <input type=\"text\" id=\"comment-img-" + item.id + "\" placeholder=\"Custom Image URL (Optional)\" style=\"flex-grow:1; padding:8px; border:1px solid #cbd5e1; border-radius:4px; font-size:13px;\">\n" +
              "                    </div>\n" +
              "                    <textarea id=\"comment-text-" + item.id + "\" rows=\"3\" placeholder=\"Write your comment...\" style=\"width:100%; padding:8px; margin-bottom:8px; border:1px solid #cbd5e1; border-radius:4px; font-size:13px;\"></textarea>\n" +
              "                    <button onclick=\"postComment(\x27" + item.id + "\x27, \x27" + gasUrl + "\x27)\" style=\"background:#2563eb; color:#fff; border:none; padding:8px 14px; border-radius:4px; cursor:pointer; font-size:13px;\">Post Comment</button>\n" +
              "                </div>\n" +
              "            </div>\n" +

              "        </article>\n" +
              "    </main>\n" +
              "    \n" +
              "    <script src=\"https://cdn.jsdelivr.net/npm/marked/marked.min.js\"></script>\n" +
              "    <script>\n" +
              "        async function runComparison(id, apiUrl) {\n" +
              "            const query = document.getElementById(\"compare-query-\" + id).value;\n" +
              "            const resultDiv = document.getElementById(\"comparison-result-\" + id);\n" +
              "            if (!query) { alert(\"Please enter products to compare!\"); return; }\n" +
              "            resultDiv.innerHTML = \"⏳ Grounding and calculating VIP upgrade metrics...\";\n" +
              "            try {\n" +
              "                const response = await fetch(apiUrl, {\n" +
              "                    method: \"POST\",\n" +
              "                    headers: { \"Content-Type\": \"text/plain;charset=utf-8\" },\n" +
              "                    body: JSON.stringify({ action: \"compare\", query: query })\n" +
              "                });\n" +
              "                const data = await response.json();\n" +
              "                if (data.success) {\n" +
              "                    let text = data.result;\n" +
              "                    text = text.replace(/\\+(\\d+)%/g, (match, p1) => {\n" +
              "                        const val = Math.min(parseInt(p1), 100);\n" +
              "                        return '<div style=\"margin: 8px 0;\"><span style=\"font-weight: bold; color: #16a34a;\">+' + val + '% Performance Boost</span><div style=\"background: #e2e8f0; border-radius: 4px; height: 10px; width: 100%; margin-top: 4px; overflow: hidden;\"><div style=\"background: #22c55e; height: 100%; width: ' + val + '%;\"></div></div></div>';\n" +
              "                    });\n" +
              "                    resultDiv.innerHTML = marked.parse(text);\n" +
              "                    document.getElementById(\"edit-content-\" + id).value = text;\n" +
              "                } else {\n" +
              "                    resultDiv.innerHTML = \"Error: \" + (data.error || \"Failed to fetch comparison.\");\n" +
              "                }\n" +
              "            } catch (err) {\n" +
              "                resultDiv.innerHTML = \"Connection error: \" + err.toString();\n" +
              "            }\n" +
              "        }\n" +
              "        \n" +
              "        function applyEdits(id) {\n" +
              "            const content = document.getElementById(\"edit-content-\" + id).value;\n" +
              "            const imgUrl = document.getElementById(\"edit-img-\" + id).value;\n" +
              "            document.getElementById(\"top-banner-container\").innerHTML = imgUrl ? '<img src=\"' + imgUrl + '\" alt=\"Banner\" style=\"width:100%; max-height:220px; object-fit:cover; border-radius:8px; margin-bottom:15px;\">' : '';\n" +
              "            document.getElementById(\"rendered-seo-body\").innerHTML = marked.parse(content);\n" +
              "            alert(\"Applied locally! Remember to save this content into your Google Sheet to keep it permanent.\");\n" +
              "        }\n" +

              "        async function postComment(id, apiUrl) {\n" +
              "            const author = document.getElementById(\"comment-author-\" + id).value;\n" +
              "            const text = document.getElementById(\"comment-text-\" + id).value;\n" +
              "            const emoji = document.getElementById(\"comment-emoji-\" + id).value;\n" +
              "            const imageUrl = document.getElementById(\"comment-img-\" + id).value;\n" +
              "            if(!text) { alert(\"Please write a comment!\"); return; }\n" +
              "            try {\n" +
              "                const res = await fetch(apiUrl, {\n" +
              "                    method: \"POST\",\n" +
              "                    headers: { \"Content-Type\": \"text/plain;charset=utf-8\" },\n" +
              "                    body: JSON.stringify({ action: \"add_comment\", mediaId: id, author: author, text: text, emoji: emoji, imageUrl: imageUrl })\n" +
              "                });\n" +
              "                const data = await res.json();\n" +
              "                if(data.success) { location.reload(); } else { alert(\"Failed to post comment\"); }\n" +
              "            } catch(e) { alert(\"Error posting comment\"); }\n" +
              "        }\n" +

              "        async function deleteComment(commentId, apiUrl) {\n" +
              "            const pwd = prompt(\"Enter Admin Password to delete comment:\");\n" +
              "            if(!pwd) return;\n" +
              "            try {\n" +
              "                const res = await fetch(apiUrl, {\n" +
              "                    method: \"POST\",\n" +
              "                    headers: { \"Content-Type\": \"text/plain;charset=utf-8\" },\n" +
              "                    body: JSON.stringify({ action: \"delete_comment\", password: pwd, commentId: commentId })\n" +
              "                });\n" +
              "                const data = await res.json();\n" +
              "                if(data.success) { location.reload(); } else { alert(data.error || \"Deletion failed\"); }\n" +
              "            } catch(e) { alert(\"Connection error\"); }\n" +
              "        }\n" +
              "    </script>\n" +
              "    <script type=\"application/ld+json\">" + JSON.stringify(item.schema || {}) + "</script>\n" +
              "</body>\n" +
              "</html>";

              fs.writeFileSync("pages/" + item.id + ".html", html);
            });
          '

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git pull origin main --rebase || true
          git add data.json pages/
          git diff --cached --quiet || \
          git commit -m "Fix workflow string escaping and deploy pages"
          git push origin main
