name: Sync Spreadsheet Data & Build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch JSON from Google Apps Script
        run: |
          curl -L "${{ secrets.GAS_URL }}" -o data.json
          jq empty data.json

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Auto-update data.json from spreadsheet AI feed" && git pull origin main --rebase --autostash || git rebase --abort && git push origin main)
