name: Keep Monetag Verification and MultiTag

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monetag.yml"
      - "index.html"
      - "pages/**"
      - "sw.js"
  workflow_run:
    workflows:
      - "Update Media Data & Generate Pages"
    types:
      - completed

permissions:
  contents: write

jobs:
  inject:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Keep Monetag verification and MultiTag in HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          verification = '<meta name="monetag" content="2cc0acc1fd02d70d710e75d874c636d3">'
          multitag = '<script src="https://quge5.com/88/tag.min.js" data-zone="278011" async data-cfasync="false"></script>'

          files = [Path('index.html')]
          pages = Path('pages')
          if pages.exists():
              files.extend(sorted(pages.glob('*.html')))

          for path in files:
              if not path.exists():
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              # Keep verification near the top of <head>.
              if verification not in text:
                  marker = '<meta charset="UTF-8">'
                  if marker in text:
                      text = text.replace(marker, marker + '\n    ' + verification, 1)
                  else:
                      text = text.replace('<head>', '<head>\n    ' + verification, 1)

              # Keep the MultiTag directly after verification, high in <head>.
              if 'https://quge5.com/88/tag.min.js' not in text:
                  if verification in text:
                      text = text.replace(verification, verification + '\n    ' + multitag, 1)
                  else:
                      text = text.replace('<head>', '<head>\n    ' + multitag, 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'Updated {path}')
              else:
                  print(f'Already configured {path}')
          PY

      - name: Commit Monetag changes if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Monetag HTML changes needed."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html pages/
          git commit -m "Keep Monetag verification and MultiTag on site pages"
          git push origin main
