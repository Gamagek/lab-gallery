name: Manual Monetag Verification Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Verify Monetag files and tags
        shell: bash
        run: |
          set -euo pipefail

          test -f sw.js
          test -f s26fe-deals-widget.js
          test -f samsung-galaxy-s26-fe-review/index.html

          grep -q 'name="monetag" content="2cc0acc1fd02d70d710e75d874c636d3"' index.html
          grep -q 'https://quge5.com/88/tag.min.js' index.html
          grep -q 'name="monetag" content="2cc0acc1fd02d70d710e75d874c636d3"' samsung-galaxy-s26-fe-review/index.html
          grep -q 'https://quge5.com/88/tag.min.js' samsung-galaxy-s26-fe-review/index.html

          echo "Monetag core files and permanent S26 FE review are present."
          echo "Generated pages now receive Monetag and deal links directly from build.yml."
