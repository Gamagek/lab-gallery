<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory SEO Media Review Gallery</title>
    <meta name="description" content="Fully automated AI-scanned media gallery featuring verified brand comparisons, specifications, and VIP upgrade insights.">
    <meta name="keywords" content="smartphone, comparison, mobile, review, tech">
    <meta name="robots" content="index,follow,max-image-preview:large">
    <link rel="canonical" href="https://lab-gallery.pages.dev/">
    <meta name="theme-color" content="#0d6efd">

    <!-- OpenGraph Meta Tags -->
    <meta property="og:title" content="Laboratory SEO Media Review Gallery">
    <meta property="og:description" content="Fully automated AI-scanned media gallery featuring verified brand comparisons, specifications, and VIP upgrade insights.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://lab-gallery.pages.dev/assets/logo.png">
    <meta property="og:image:alt" content="Laboratory SEO Media Review Gallery Logo">
    <meta property="og:url" content="https://lab-gallery.pages.dev/">
    <meta property="og:site_name" content="Laboratory SEO Gallery">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Laboratory SEO Media Review Gallery">
    <meta name="twitter:description" content="Fully automated AI-scanned media gallery featuring verified brand comparisons, specifications, and VIP upgrade insights.">
    <meta name="twitter:image" content="https://lab-gallery.pages.dev/assets/logo.png">
    <meta name="twitter:image:alt" content="Laboratory SEO Media Review Gallery Logo">
    <meta name="twitter:site" content="@labgallery">

    <!-- JSON-LD Containers -->
    <div id="seo-schema-container">
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "WebSite",
          "name": "Laboratory SEO Media Review Gallery",
          "url": "https://lab-gallery.pages.dev/"
        }
        </script>
        <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "Organization",
          "name": "Laboratory SEO",
          "url": "https://lab-gallery.pages.dev/",
          "logo": "https://lab-gallery.pages.dev/assets/logo.png"
        }
        </script>
    </div>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Laboratory SEO Media Review Gallery</h1>
        <p>AI-grounded brand specifications, product comparisons, and VIP upgrade intelligence.</p>
        <div class="controls-bar">
            <input type="text" id="search-input" placeholder="Search reviews or specs..." aria-label="Search reviews">
            <select id="category-filter" aria-label="Filter media category">
                <option value="all">All Categories</option>
                <option value="video">Video</option>
                <option value="image">Image</option>
                <option value="audio">Audio</option>
            </select>
            <button id="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button>
        </div>
    </header>

    <div id="error-message" role="alert"></div>
    
    <main class="gallery-container" itemscope itemtype="https://schema.org/ImageGallery" id="gallery">
        <!-- Dynamic cards populated by app.js -->
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Laboratory SEO Media Review Gallery. All rights reserved.</p>
    </footer>

    <script src="app.js" defer></script>
</body>
</html>
