<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Tech Matchup & VIP Upgrade Intelligence</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for parsing markdown text responses -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        .prose table { width: 100%; border-collapse: collapse; margin-top: 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
        .prose th, .prose td { border: 1px solid #cbd5e1; padding: 0.65rem; text-align: left; }
        .prose th { background-color: #f1f5f9; font-weight: 600; color: #334155; }
        
        /* Custom Styling for Performance Bars */
        .perf-bar-container {
            background-color: #e2e8f0;
            border-radius: 9999px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-top: 6px;
            margin-bottom: 12px;
        }
        .perf-bar-fill {
            background-color: #22c55e;
            height: 100%;
            border-radius: 9999px;
            transition: width 0.6s ease-in-out;
        }
        .perf-text-tag {
            color: #16a34a;
            font-weight: 700;
            font-size: 0.9rem;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-indigo-900 text-white shadow-lg py-6 px-4">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2">
            <div>
                <h1 class="text-2xl font-extrabold flex items-center gap-2">
                    ⚡ Pro Tech Matchup & VIP Intelligence
                </h1>
            </div>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Search Controls Box -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Product A</label>
                    <input type="text" id="productA" placeholder="e.g. Samsung Galaxy S26" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50 text-slate-900 font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Product B (VIP Target)</label>
                    <input type="text" id="productB" placeholder="e.g. Apple iPhone 17" 
                        class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition bg-slate-50 text-slate-900 font-medium">
                </div>
            </div>
            <button onclick="compareProducts()" id="compareBtn" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold py-3.5 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-md shadow-indigo-100">
                <span>🔍 Run Advanced Dual-Key Analysis</span>
            </button>
        </div>

        <!-- Loader State Area -->
        <div id="loader" class="hidden flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-indigo-600 border-t-transparent mb-4"></div>
            <p class="text-slate-600 font-medium animate-pulse">Consulting dual-key neural synthesis & grounding web data...</p>
        </div>

        <!-- Error Notification Box -->
        <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-700 px-5 py-4 rounded-xl mb-6 text-sm"></div>

        <!-- Results Side-by-Side Grid -->
        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 hidden">
            <!-- Product A Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                    <h2 id="titleA" class="font-bold text-slate-800 text-lg truncate">Product A</h2>
                    <span class="text-xs bg-indigo-50 text-indigo-700 font-semibold px-2.5 py-1 rounded-md border border-indigo-100">Standard</span>
                </div>
                <div id="contentA" class="p-6 prose prose-slate max-w-none text-sm overflow-y-auto max-h-[800px] leading-relaxed"></div>
            </div>

            <!-- Product B Card -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex items-center justify-between">
                    <h2 id="titleB" class="font-bold text-slate-800 text-lg truncate">Product B</h2>
                    <span class="text-xs bg-amber-50 text-amber-700 font-semibold px-2.5 py-1 rounded-md border border-amber-100">👑 VIP Target</span>
                </div>
                <div id="contentB" class="p-6 prose prose-slate max-w-none text-sm overflow-y-auto max-h-[800px] leading-relaxed"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400 mt-auto">
        &copy; Product Matchup Engine
    </footer>

    <!-- Client Script Logic with Enhanced Progress Bar Injector -->
    <script>
        const GAS_WEBAPP_URL = "YOUR_NEW_DEPLOYMENT_WEB_APP_URL_HERE";

        async function compareProducts() {
            const productA = document.getElementById('productA').value.trim();
            const productB = document.getElementById('productB').value.trim();
            
            const loader = document.getElementById('loader');
            const resultsGrid = document.getElementById('resultsGrid');
            const errorBox = document.getElementById('errorBox');
            const compareBtn = document.getElementById('compareBtn');

            if (!productA || !productB) {
                alert("Please fill in both product fields.");
                return;
            }

            // Reset UI states
            errorBox.classList.add('hidden');
            resultsGrid.classList.add('hidden');
            loader.classList.remove('hidden');
            loader.style.display = 'flex';
            compareBtn.disabled = true;

            try {
                const requestUrl = `${GAS_WEBAPP_URL}?productA=${encodeURIComponent(productA)}&productB=${encodeURIComponent(productB)}`;
                
                const response = await fetch(requestUrl);
                const json = await response.json();

                if (json.error) {
                    throw new Error(json.error);
                }

                // Populate Product A
                document.getElementById('titleA').innerText = productA;
                document.getElementById('contentA').innerHTML = marked.parse(json.productA || "No data returned.");

                // Populate Product B + Upgrade Intelligence
                document.getElementById('titleB').innerText = productB;
                let combinedB = json.productB || "";
                let parts = combinedB.split("--- subgroups ---");
                
                let finalHTML = marked.parse(parts[0] || "");
                if (parts[1]) {
                    let upgradeMarkdown = parts[1];
                    
                    upgradeMarkdown = upgradeMarkdown.replace(
                        /(\+?\d+%\s*(?:Performance Boost|Combined Frame-Rate Fluidity & Battery Life Boost|Peak CPU Voltage and Key Power Performance Boost)?)/gi, 
                        (match, p1) => {
                            let digits = parseInt(p1.replace(/\D/g, '')) || 25;
                            let width = Math.min(digits * 2.5, 100);
                            return `<span class="perf-text-tag">${match}</span><div class="perf-bar-container"><div class="perf-bar-fill" style="width: ${width}%;"></div></div>`;
                        }
                    );

                    finalHTML += `<hr class="my-6 border-slate-200"><h3 class="text-base font-bold text-slate-900 mb-3">3. VIP Upgrade Intelligence</h3>` + marked.parse(upgradeMarkdown);
                }
                document.getElementById('contentB').innerHTML = finalHTML;

                resultsGrid.classList.remove('hidden');
            } catch (err) {
                errorBox.innerText = `Analysis failed: ${err.message}`;
                errorBox.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                loader.style.display = 'none';
                compareBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
