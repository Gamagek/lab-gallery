<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudflare Media & SEO Review Gallery</title>
    <style>
        :root { --bg: #f8f9fa; --card-bg: #ffffff; --text-main: #212529; --text-muted: #6c757d; --accent: #0d6efd; --border-color: #dee2e6; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; box-sizing: border-box; }
        header { max-width: 1200px; margin: 0 auto 24px auto; text-align: center; }
        header h1 { margin: 0 0 8px 0; font-size: 1.8rem; }
        header p { margin: 0 0 16px 0; color: var(--text-muted); font-size: 0.95rem; }
        .search-container { max-width: 600px; margin: 0 auto; }
        .search-container input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; box-sizing: border-box; background: var(--card-bg); color: var(--text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .main-wrap { max-width: 1200px; margin: 0 auto; }
        footer { max-width: 1200px; margin: 40px auto 0 auto; text-align: center; font-size: 0.85rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>Cloudflare Media & SEO Review Gallery</h1>
        <p>AI-grounded video streaming reviews, multi-tier intelligence, and VIP upgrade insights.</p>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search reviews, specs, or models...">
        </div>
    </header>

    <main class="main-wrap">
        <div id="public-gallery"></div>
    </main>

    <footer>
        &copy; 2026 Cloudflare Media & SEO Review Gallery. All rights reserved.
    </footer>

    <script src="app.js"></script>
</body>
</html>
