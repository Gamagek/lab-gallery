<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory SEO Media Review Gallery & AI Intelligence</title>
    <meta name="description" content="AI-grounded brand specifications, multi-model product comparisons, and VIP upgrade intelligence.">
    
    <!-- Dynamic SEO Schema Container for Google Crawlers -->
    <div id="seo-schema-container"></div>

    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #212529;
            --text-muted: #6c757d;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --accent: #0d6efd;
            --vip-color: #e37400;
            --radius: 10px;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --card-bg: #1e1e1e;
            --border-color: #333333;
            --accent: #3d8bfd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            max-width: 1200px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 4px 0;
        }

        p {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .controls-bar {
            max-width: 1200px;
            margin: 0 auto 24px auto;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .controls-bar input, .controls-bar select, .controls-bar button {
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .controls-bar input { flex: 1; min-width: 240px; }
        .controls-bar button { cursor: pointer; font-weight: 600; }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }

        .media-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
        }

        .media-figure {
            margin: 0;
            position: relative;
        }

        .media-content {
            width: 100%;
            height: 220px;
            background: #000;
            object-fit: cover;
        }

        .sr-only {
            position: absolute;
            width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;
        }

        .media-info {
            padding: 20px;
        }

        .media-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .media-desc {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .comparison-box {
            background: rgba(13, 110, 253, 0.08);
            border-left: 4px solid var(--accent);
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.88rem;
            margin-bottom: 10px;
            color: var(--text-main);
            line-height: 1.4;
        }

        .vip-banner {
            background: rgba(227, 116, 0, 0.1);
            border-left: 4px solid var(--vip-color);
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--vip-color);
            margin-bottom: 12px;
            font-weight: 500;
            line-height: 1.4;
        }

        .media-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 12px;
        }

        .tag {
            background: rgba(13, 110, 253, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        #error-message {
            max-width: 1200px;
            margin: 0 auto;
            color: #dc3545;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: center;
        }

        .site-footer {
            max-width: 1200px;
            margin: 40px auto 0 auto;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Laboratory SEO Media Review Gallery</h1>
        <p>AI-grounded brand specifications, product comparisons, and VIP upgrade intelligence.</p>
    </div>
    <button id="dark-mode-toggle" onclick="document.body.classList.toggle('dark-mode')">🌓 Theme</button>
</header>

<div class="controls-bar">
    <input type="text" id="search-input" placeholder="Search reviews, specs, or models...">
    <select id="category-filter">
        <option value="all">All Categories</option>
        <option value="video">Video</option>
        <option value="image">Image</option>
    </select>
</div>

<div id="error-message"></div>

<main id="gallery" class="gallery-container">
    <!-- Cards injected dynamically here for Google Crawlers -->
</main>

<footer class="site-footer">
    &copy; 2026 Laboratory SEO Media Review Gallery. All rights reserved.
</footer>

<script src="./app.js"></script>
</body>
</html>
