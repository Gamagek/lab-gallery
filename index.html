<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratory SEO Media Review Gallery</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #212529;
            --text-muted: #6c757d;
            --card-bg: #ffffff;
            --border-color: #dee2e6;
            --accent-color: #0d6efd;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        header {
            max-width: 1200px;
            margin: 0 auto 30px auto;
        }
        h1 {
            font-size: 1.75rem;
            margin-bottom: 5px;
        }
        p {
            color: var(--text-muted);
            margin-top: 0;
        }
        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .media-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .media-content {
            width: 100%;
            height: 200px;
            background: #000;
            object-fit: cover;
        }
        .media-info {
            padding: 15px;
        }
        .media-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .media-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        #error-message {
            max-width: 1200px;
            margin: 0 auto;
            color: #dc3545;
            font-weight: 500;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Laboratory SEO Media Review Gallery</h1>
        <p>Fully automated AI-moderated static architecture with instant crawler indexing.</p>
    </header>

    <div id="error-message"></div>
    <main id="gallery" class="gallery-container"></main>

    <script>
        async function loadContentLibrary() {
            const errorDiv = document.getElementById('error-message');
            const galleryGrid = document.getElementById('gallery');
            
            try {
                // Fetch data.json with no-store to prevent caching old responses
                const response = await fetch('./data.json', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const items = await response.json();
                
                if (!Array.isArray(items) || items.length === 0) {
                    errorDiv.textContent = 'Content library is currently empty.';
                    return;
                }

                errorDiv.textContent = '';
                galleryGrid.innerHTML = '';
                
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'media-card';
                    
                    card.innerHTML = `
                        <video controls class="media-content">
                            <source src="${item.url || ''}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        <div class="media-info">
                            <div class="media-title">${item.title || 'Video Item ' + (item.id || '')}</div>
                            <div class="media-desc">${item.description || 'Type: ' + (item.type || 'video')}</div>
                        </div>
                    `;
                    galleryGrid.appendChild(card);
                });

            } catch (err) {
                console.error('Fetch error:', err);
                errorDiv.textContent = 'Error loading content library.';
            }
        }

        document.addEventListener('DOMContentLoaded', loadContentLibrary);
    </script>
</body>
</html>
